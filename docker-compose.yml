version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: banking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: banking_db
      MYSQL_USER: banking_user
      MYSQL_PASSWORD: banking_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking-network

  # Backend API
  backend:
    build: ./bankingBackend
    container_name: banking-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_USER: banking_user
      DB_PASSWORD: banking_password
      DB_NAME: banking_db
      DB_PORT: 3306
      JWT_SECRET: your_super_secret_jwt_key_change_this
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - db
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/test-db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: ./banking-ui
    container_name: banking-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - banking-network

volumes:
  db_data:

networks:
  banking-network:
    driver: bridge